# ===================================================================
# App Info
# ===================================================================
appName: 'Aurora Files'
iosDisplayName: 'Aurora Files'
version: '2.4.0'

# ===================================================================
# App IDs
# ===================================================================
# Android App ID
_appId: 'com.afterlogic.aurorafiles'
# iOS App ID
_appIdIos: 'com.afterlogic.aurorafiles'
# Apple Group ID
_appleGroupId: 'group.com.afterlogic.aurorafiles'
# IOS Developer ID
_iosDeveloperId: 'J7AW6VHJK4'

# ===================================================================
# Splash Screen
# ===================================================================
# Android splash screen
backgroundColor: '#FFFFFF'
useBackgroundImage: false
# --- light theme ---
splashGradientTop: '#FFFFFF'
splashGradientBottom: '#FFFFFF'
# --- dark theme ---
splashGradientTopDark: '#000000'
splashGradientBottomDark: '#222222'

# ===================================================================
# URLs & Links
# ===================================================================
autodiscoverUrl: 'https://{domain}/aurora-autodiscover.json?email={email}'
deleteAccountLink: ''
privacyPolicy: 'https://afterlogic.com/privacy-policy'
registrationLink: ''

# ===================================================================
# Feature Flags & App Settings
# ===================================================================
alwaysLightTheme: false
flatDesign: false
pgpEnable: true
secureSharingEnable: true
teamSharingEnable: true
useOutlinedInputFields: false

# ===================================================================
# FIDO (YubiKey)
# ===================================================================
useYubiKit: false
yubicoFlutterLib: 'path: module/mocks/yubico_flutter'

# ===================================================================
# Custom Build Settings
# ===================================================================
useCustomIcons: false
useCustomInputStyles: false
