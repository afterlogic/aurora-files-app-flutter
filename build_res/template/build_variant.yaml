# ===================================================================
# App Info
# ===================================================================
appName: 'my.app.id'
iosDisplayName: 'my.app.id'
version: '1.0.0'

# ===================================================================
# App IDs
# ===================================================================
# Android App ID
_appId: ''
# iOS App ID
_appIdIos: ''
# iOS App Group ID
_appleGroupId: ''
# iOS Developer ID
_iosDeveloperId: ''

# ===================================================================
# Splash Screen
# ===================================================================
# Colors for android splash screen
backgroundColor: '#FFFFFF'
splashGradientBottom: '#FFFFFF'
splashGradientBottomDark: '#000000'
splashGradientTop: '#FFFFFF'
splashGradientTopDark: '#000000'

# ===================================================================
# URLs & Links
# ===================================================================
autodiscoverUrl: 'https://{domain}/aurora-autodiscover.json?email={email}'
privacyPolicy: ''
termsOfService: ''

# ===================================================================
# Feature Flags & App Settings
# ===================================================================
canUpgradePlan: false
flatDesign: false
legacyPgpKey: false
logger: false
pgpEnable: false
secureSharingEnable: false
supportAllowAccess: false
teamSharingEnable: false
useMainLogo: true

# ===================================================================
# FIDO (YubiKey)
# ===================================================================
# fido
useYubiKit: false
yubicoFlutterLib: 'path: module/mocks/yubico_flutter'
#useYubiKit: true
#yubicoFlutterLib: "git: https://github.com/afterlogic/yubico_flutter"

# ===================================================================
# Custom Build Settings
# ===================================================================
useCustomInputStyles: false
